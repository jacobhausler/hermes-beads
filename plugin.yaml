name: hermes-beads
version: 0.1.1
description: Native Beads (bd) work-graph plugin — fixed-argv adapter, scoped ready frontier, claim with read-back, guarded writes
description_long: |
  Thin plugin boundary to the bd CLI: explicit store path + actor, fixed argv
  (no shell interpolation), honest exit-code map (0/1/13/2), JSON parsing
  including failed rows, named unavailable errors. Plain bd stays fully
  sufficient on its own; this plugin only lowers agent effort.
author: "Jacob Hausler"
license: MIT
requires_hermes: ">=0.21"
provides_tools:
  - beads_smoke
  - beads_frontier
  - beads_show
  - beads_claim
  - beads_update
  - beads_comment
